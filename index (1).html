<script>(function(){var P=JSON.parse(document.getElementById('lock-payload').textContent),msg=document.getElementById('msg'),btn=document.getElementById('go');
function d64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
if(!window.crypto||!crypto.subtle){msg.textContent='이 주소(http)에서는 열 수 없습니다. https 주소로 여세요.';msg.className='err';btn.disabled=true;return}
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();btn.disabled=true;msg.className='';msg.textContent='확인 중…';
try{var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.iv)},key,d64(P.ct));
var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}
catch(x){msg.textContent='비밀번호가 맞지 않습니다.';msg.className='err';btn.disabled=false;document.getElementById('pw').select()}});})();</script>
